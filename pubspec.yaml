name: yt_clone
description: "Youtify - A premium YouTube experience built."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0

  # Video Player
  video_player: ^2.8.3
  chewie: ^1.7.4
  youtube_explode_dart: ^2.2.2
  audio_session: ^0.1.18

  # UI & Animations
  animations: ^2.0.11
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0

  # Utilities
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  package_info_plus: ^10.2.1
  screen_brightness: ^2.1.11

  # Networking & Files
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  dio: ^5.4.0
  
  # Storage & Permissions
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  flutter_local_notifications: ^22.3.1
  
  # UI Components

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0c0d14"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
# dependency_overrides removed - using latest versions

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - .env
